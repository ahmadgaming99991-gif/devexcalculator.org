name: Lighthouse

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a slow regression is noticed without gating every push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Core Web Vitals
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://devexcalculator.org

      - name: Start server
        run: npx next start --port 3100 &

      - name: Wait for the server
        run: npx wait-on http://127.0.0.1:3100/api/health/ --timeout 120000

      # Three runs per URL, median reported. A single run on shared CI hardware
      # is noisy enough that a hard gate on it would fail for reasons unrelated
      # to the change under review.
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:3100/
            http://127.0.0.1:3100/robux-to-usd/
            http://127.0.0.1:3100/devex-rates/
            http://127.0.0.1:3100/conversions/100000-robux-to-usd/
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.github/lighthouse-budget.json

      - name: Note on thresholds
        if: always()
        run: |
          echo "Accessibility, best practices and SEO are gated at 100/95/100."
          echo "Performance is reported but not gated: CI runners vary enough that"
          echo "a hard gate produces failures unrelated to the change under review."
          echo "Review the uploaded report when performance drops below 90."
