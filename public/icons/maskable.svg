<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DevEx Calculator">
  <title>DevEx Calculator</title>
  <!--
    Maskable variant. The tile fills the square with no corner radius of its
    own, because the platform's mask supplies the corner shape and a rounded
    source would be rounded twice.

    The bars are scaled to 0.84 about the centre so the whole mark sits inside
    the 80% safe circle: the furthest drawn corner is then 153 units from the
    centre, against the 204.8 the mask guarantees.
  -->
  <rect width="512" height="512" fill="#2563eb"/>
  <g transform="translate(256 256) scale(0.84) translate(-256 -256)" fill="#fff">
    <rect x="96" y="148" width="320" height="80" rx="40"/>
    <rect x="96" y="284" width="184" height="80" rx="40"/>
  </g>
</svg>
