<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DevEx Calculator">
  <title>DevEx Calculator</title>
  <!--
    Maskable variant. The mark is scaled to sit inside the 80% safe zone so a
    platform applying a circular or squircle mask cannot clip it, and the tile
    fills the full square because the mask supplies the corner shape.
  -->
  <defs>
    <linearGradient id="mtile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#mtile)"/>
  <g transform="translate(256 256) scale(0.62) translate(-256 -256)">
    <g fill="none" stroke="#ffffff" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
      <path d="M144 344 L224 264 L288 304 L376 168"/>
      <path d="M298 168 L376 168 L376 246"/>
    </g>
    <circle cx="144" cy="344" r="43" fill="#ffffff"/>
  </g>
</svg>
