<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DevEx Calculator">
  <title>DevEx Calculator</title>
  <!--
    Maskable variant. The mark is scaled to sit inside the 80% safe zone so a
    platform applying a circular or squircle mask cannot clip it.
  -->
  <rect width="512" height="512" fill="#2563eb"/>
  <g transform="translate(256 256) scale(0.62) translate(-256 -256)">
    <circle cx="256" cy="160" r="32" fill="#ffffff"/>
    <rect x="128" y="240" width="256" height="32" rx="16" fill="#ffffff"/>
    <circle cx="256" cy="352" r="32" fill="#ffffff"/>
    <path d="M376 392 L432 336" stroke="#67e8f9" stroke-width="32" stroke-linecap="round"/>
  </g>
</svg>
