<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Tab icon.

    A favicon is judged at sixteen pixels, so it is drawn to the rules that
    hold there rather than shrunk from something drawn for a larger frame. One
    flat colour: a gradient across 32 units has about four pixels to resolve in
    and just averages into a muddier tone. Filled shapes rather than strokes,
    and nothing thinner than 5/32 — the previous mark stroked a dollar sign at
    3.1/32, which lands under two pixels and fringes into grey. Full bleed,
    because a favicon has no room for padding; the corner radius does the work
    an outline would.

    The two bars are deliberately unequal, which is the site's whole argument:
    a Robux balance is not the dollar figure beside it. The blue is
    the primary colour token, the same value the manifest publishes as its
    theme colour and the accent the whole site is built on, so the tab matches
    the page it opens.
  -->
  <rect width="32" height="32" rx="7.5" fill="#2563eb"/>
  <rect x="6" y="9.25" width="20" height="5" rx="2.5" fill="#fff"/>
  <rect x="6" y="17.75" width="11.5" height="5" rx="2.5" fill="#fff"/>
</svg>
